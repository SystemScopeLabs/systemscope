[workspace]
resolver = "3"
members = ["runtime", "components/*", "reference", "tests/acceptance", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98.1"

[workspace.dependencies]
# Local sibling checkout during multi-repo development (see plan.md §10).
systemscope-contracts = { path = "../contracts/crates/systemscope-contracts" }
systemscope-runtime = { path = "runtime" }
systemscope-toy = { path = "components/toy" }
systemscope-reference = { path = "reference" }
systemscope-acceptance = { path = "tests/acceptance" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
float_arithmetic = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"

# Every test job runs the full m0-reference (about 1.3 million events) many times. Light
# optimization cuts a traced run from about 4 s to 1.5 s and keeps debug assertions and
# overflow checks.
[profile.dev]
opt-level = 1
