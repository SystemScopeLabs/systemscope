[package]
name = "systemscope-rv32i"
description = "RV32I decode, architectural state, and CPU component for SystemScope M1"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

# Decode, the register file, and execution are pure: they use contracts only for the
