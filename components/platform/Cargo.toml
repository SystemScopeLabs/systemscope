[package]
name = "systemscope-platform"
description = "Platform components for SystemScope: address bus, multi-master bus, sparse RAM, a simple UART, a simple IRQ controller, and a simple block media"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

# Components depend only on contracts, never on the runtime (docs/m1-design.md §3).
[dependencies]
systemscope-contracts.workspace = true

[dev-dependencies]
# Tests compute the image hash a builder would pass in.
blake3 = "1"
proptest = "1"
# Tests drive the components through the real runtime; the library itself never
# depends on it.
systemscope-runtime.workspace = true

[lints]
workspace = true
