[package]
name = "systemscope-toy"
description = "Toy components for validating SystemScope M0 contracts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

# Components depend only on contracts, never on the runtime (docs/m0-design.md §2).
[dependencies]
systemscope-contracts.workspace = true

[dev-dependencies]
serde_json = "1"
# Tests drive the components through the real runtime; the library itself never
# depends on it.
systemscope-runtime.workspace = true

[lints]
workspace = true
