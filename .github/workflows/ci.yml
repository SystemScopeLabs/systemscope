name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: systemscope

jobs:
  lint:
    name: fmt, check, clippy, machete
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: systemscope
      # systemscope depends on `../contracts` by path (plan.md §10), so reproduce the
      # sibling layout, with contracts pinned to a pushed revision (bump it deliberately).
      - uses: actions/checkout@v4
        with:
          repository: SystemScopeLabs/contracts
          ref: 90900a128d51f6b42e86dc789447882c90c52ef4
          path: contracts
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: systemscope
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo machete

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: systemscope
      # systemscope depends on `../contracts` by path (plan.md §10), so reproduce the
      # sibling layout, with contracts pinned to a pushed revision (bump it deliberately).
      - uses: actions/checkout@v4
        with:
          repository: SystemScopeLabs/contracts
          ref: 90900a128d51f6b42e86dc789447882c90c52ef4
          path: contracts
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: systemscope
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Unit and integration tests
        run: cargo nextest run --workspace --exclude systemscope-acceptance --exclude systemscope-rv32 --locked --profile ci --no-fail-fast
      # nextest does not run doctests.
      - name: Doctests
        run: cargo test --workspace --doc --locked
      # docs/m0-design.md §9 on the full m0-reference. The golden digests and the portable
      # snapshot are checked on both operating systems.
      - name: Acceptance harness self-tests
        run: cargo nextest run -p systemscope-acceptance --locked --profile ci --no-fail-fast --lib --bins
      - name: AT-1 reproducibility (fixed seeds, golden digests)
        run: cargo nextest run -p systemscope-acceptance --locked --profile ci --no-fail-fast --test at1
      - name: AT-2 snapshot/restore equivalence (checkpoints, portable snapshot)
        run: cargo nextest run -p systemscope-acceptance --locked --profile ci --no-fail-fast --test at2
      - name: AT-3 observation invariance (O0-O5, compile-fail)
        run: cargo nextest run -p systemscope-acceptance --locked --profile ci --no-fail-fast --test at3 --test compile_fail
      # docs/m1-design.md §10.2, §10.6: the committed rv32ui ELFs and hello.elf, run from
      # the same bytes on both operating systems. No step builds anything or uses the
      # network.
      - name: rv32ui fixtures, hello.elf, and block_irq.elf match their manifests
        run: cargo xtask rv32-fixtures verify
      - name: M1-A2 rv32ui (40 selected tests)
        run: cargo nextest run -p systemscope-rv32 --locked --profile ci --no-fail-fast --lib --test rv32ui --test fixtures
      - name: M1-A5 hello.elf through the CPU and SimpleUart (output, checkpoints)
        run: cargo nextest run -p systemscope-rv32 --locked --profile ci --no-fail-fast --test hello
      # docs/m2-design.md §11, §12: m2-reference and block_irq.elf with its disk fixture,
      # end to end: DMA transfers, CPU/DMA RAM contention, the completion interrupt, the
      # handler, and determinism.
      - name: M2.8 m2-reference and block_irq.elf (builder, end to end, contention, determinism)
        run: cargo nextest run -p systemscope-rv32 --locked --profile ci --no-fail-fast --test block_irq
      # docs/m1-design.md §10.4: the committed ACT4 corpus, generated with Sail on Linux by
      # the act4 job, run from the same bytes on both operating systems.
      - name: ACT4 corpus matches its manifest (pins, config, audit)
        run: cargo xtask act4 verify
      - name: M1-A4 ACT4 RV32I (Sail-generated, self-checking)
        run: cargo nextest run -p systemscope-rv32 --locked --profile ci --no-fail-fast --test act4
      - name: M1-A4 ACT4 RV32I summary
        run: cargo xtask act4 run
      # docs/m1-design.md §10.1: the M1 acceptance tests on m1-reference. Both operating
      # systems check the same committed golden file and portable snapshot.
      - name: M1-A6 snapshot/restore (named checkpoints, portable snapshot, rejections)
        run: cargo nextest run -p systemscope-acceptance --locked --profile ci --no-fail-fast --test m1_a6
      - name: M1-A7 observation invariance (O0-O5)
        run: cargo nextest run -p systemscope-acceptance --locked --profile ci --no-fail-fast --test m1_a7
      - name: M1-A8 golden reproduction (in process, separate processes, seeds)
        run: cargo nextest run -p systemscope-acceptance --locked --profile ci --no-fail-fast --test m1_a8
      - name: M1 golden verify
        run: cargo xtask m1-golden verify
      # docs/m2-design.md §13: block_irq.elf on m2-reference. Every checkpoint, no
      # sampling, is restored into a fresh platform and run to the end; both operating
      # systems check the same committed golden file and portable snapshot.
      - name: M2.9 snapshot/restore (every event, stress points, watchdog, portable snapshot, rejections)
        run: cargo nextest run -p systemscope-acceptance --locked --profile ci --no-fail-fast --test m2_snapshot
      - name: M2.9 observation invariance (O0-O5)
        run: cargo nextest run -p systemscope-acceptance --locked --profile ci --no-fail-fast --test m2_observation
      - name: M2.9 golden reproduction (in process, separate processes, drift)
        run: cargo nextest run -p systemscope-acceptance --locked --profile ci --no-fail-fast --test m2_golden
      - name: M2 golden verify
        run: cargo xtask m2-golden verify
      - name: rv32ui fixtures, hello.elf, block_irq.elf, and the ACT4 corpus unchanged
        shell: bash
        run: git diff --exit-code -- tests/rv32/fixtures tests/rv32/hello tests/rv32/block_irq tests/act4
      # Only `cargo xtask bless` writes golden files; a test that wrote one would show here.
      - name: Golden files unchanged
        shell: bash
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
      # This machine's own M1 result and portable snapshot, for the m1-cross-os job.
      - name: Emit this machine's M1 result
        run: cargo xtask m1-golden emit target/m1-result
      - uses: actions/upload-artifact@v4
        with:
          name: m1-result-${{ matrix.os }}
          path: systemscope/target/m1-result
          if-no-files-found: error
      # This machine's own M2 result and portable snapshot, for the m2-cross-os job.
      - name: Emit this machine's M2 result
        run: cargo xtask m2-golden emit target/m2-result
      - uses: actions/upload-artifact@v4
        with:
          name: m2-result-${{ matrix.os }}
          path: systemscope/target/m2-result
          if-no-files-found: error

  # docs/m1-design.md §10.1 M1-A6, M1-A8: each operating system restores the portable
  # snapshot the other one took, and checks the other one's golden result against the
  # committed files and its own run.
  m1-cross-os:
    name: M1 cross-OS (${{ matrix.os }} checks ${{ matrix.from }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            from: ubuntu-latest
          - os: ubuntu-latest
            from: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: systemscope
      # systemscope depends on `../contracts` by path (plan.md §10), so reproduce the
      # sibling layout, with contracts pinned to a pushed revision (bump it deliberately).
      - uses: actions/checkout@v4
        with:
          repository: SystemScopeLabs/contracts
          ref: 90900a128d51f6b42e86dc789447882c90c52ef4
          path: contracts
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: systemscope
      - uses: actions/download-artifact@v4
        with:
          name: m1-result-${{ matrix.from }}
          path: systemscope/target/m1-foreign
      - name: Check the ${{ matrix.from }} result and restore its snapshot
        run: cargo xtask m1-golden check target/m1-foreign

  # docs/m2-design.md §13.2: each operating system restores the portable M2
  # snapshot the other one took, taken mid-DMA, and checks the other one's golden result
  # against the committed files and its own run.
  m2-cross-os:
    name: M2 cross-OS (${{ matrix.os }} checks ${{ matrix.from }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            from: ubuntu-latest
          - os: ubuntu-latest
            from: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: systemscope
      # systemscope depends on `../contracts` by path (plan.md §10), so reproduce the
      # sibling layout, with contracts pinned to a pushed revision (bump it deliberately).
      - uses: actions/checkout@v4
        with:
          repository: SystemScopeLabs/contracts
          ref: 90900a128d51f6b42e86dc789447882c90c52ef4
          path: contracts
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: systemscope
      - uses: actions/download-artifact@v4
        with:
          name: m2-result-${{ matrix.from }}
          path: systemscope/target/m2-foreign
      - name: Check the ${{ matrix.from }} result and restore its snapshot
        run: cargo xtask m2-golden check target/m2-foreign

  # docs/m1-design.md §10.6: rebuilds the rv32ui fixtures from the pinned riscv-tests,
  # hello.elf from tests/rv32/hello, and block_irq.elf and its disk fixture from
  # tests/rv32/block_irq (docs/m2-design.md §18), with the pinned toolchain on a clean
  # machine, and requires the committed bytes and manifests back. The only job that installs a RISC-V toolchain or fetches riscv-tests.
  rv32-fixtures:
    name: rv32ui fixtures rebuild (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: systemscope
      # systemscope depends on `../contracts` by path (plan.md §10), so reproduce the
      # sibling layout, with contracts pinned to a pushed revision (bump it deliberately).
      - uses: actions/checkout@v4
        with:
          repository: SystemScopeLabs/contracts
          ref: 90900a128d51f6b42e86dc789447882c90c52ef4
          path: contracts
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: systemscope
      # The versions tests/rv32/fixtures/manifest.json records; the build script checks
      # the tools' version strings again.
      - name: Install the pinned RISC-V toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-riscv64-unknown-elf=13.2.0-11ubuntu1+12 \
            binutils-riscv64-unknown-elf=2.42-1ubuntu1+6
      - name: Rebuild the fixtures
        run: cargo xtask rv32-fixtures build
      - name: Rebuilt fixtures and manifest are byte-identical
        run: |
          git diff --exit-code -- tests/rv32
          test -z "$(git status --porcelain -- tests/rv32)"

  # docs/m1-design.md §10.3, M1-A3: every selected rv32ui fixture, the generated programs
  # for the fixed seeds, and the misaligned-access programs on SystemScope against the
  # pinned Spike, retirement by retirement; then the directed M2 Zicsr, CSR, and MRET
  # programs (docs/m2-design.md §4) with the M2 CPU profile against Spike with
  # --isa=rv32i_zicsr, CSR writes included. The only job that builds or runs Spike.
  # A cached build is used only after `spike verify` checks it against the pin.
  spike:
    name: M1-A3 Spike differential (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: systemscope
      # systemscope depends on `../contracts` by path (plan.md §10), so reproduce the
      # sibling layout, with contracts pinned to a pushed revision (bump it deliberately).
      - uses: actions/checkout@v4
        with:
          repository: SystemScopeLabs/contracts
          ref: 90900a128d51f6b42e86dc789447882c90c52ef4
          path: contracts
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: systemscope
      # Spike's configure requires dtc; the differential runs Spike with --disable-dtb.
      - name: Install dtc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends device-tree-compiler=1.7.0-2build1
      - uses: actions/cache@v4
        id: spike-cache
        with:
          path: ~/spike
          key: spike-${{ runner.os }}-${{ hashFiles('systemscope/tests/rv32/build-spike.sh') }}
      - name: Build the pinned Spike
        if: steps.spike-cache.outputs.cache-hit != 'true'
        run: cargo xtask spike build ~/spike
      - name: Spike matches the pin (stamp, checkout, version, smoke run)
        run: cargo xtask spike verify ~/spike
      - name: rv32ui fixtures match their manifest
        run: cargo xtask rv32-fixtures verify
      - name: M1-A3 and M2 CSR retirement differential (40 rv32ui, 64 generated, 9 misaligned, 20 M2 CSR)
        run: cargo xtask spike diff ~/spike
      - name: Keep Spike's logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: spike-logs
          path: systemscope/target/spike-logs
          if-no-files-found: ignore

  # docs/m1-design.md §10.4, M1-A4: generates the ACT4 RV32I corpus twice from the pinned
  # ACT4, Sail, and GCC at the canonical path, requires the two generations to be
  # byte-identical and to reproduce the committed ELFs and manifest, then runs the corpus.
  # The only job that runs ACT4 or Sail. The build script checks every download, binary,
  # and version against the pins on every run, cached or not.
  act4:
    name: ACT4/Sail external validation (Ubuntu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: systemscope
      # systemscope depends on `../contracts` by path (plan.md §10), so reproduce the
      # sibling layout, with contracts pinned to a pushed revision (bump it deliberately).
      - uses: actions/checkout@v4
        with:
          repository: SystemScopeLabs/contracts
          ref: 90900a128d51f6b42e86dc789447882c90c52ef4
          path: contracts
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: systemscope
      - uses: actions/cache@v4
        with:
          path: ~/act4-cache
          key: act4-${{ runner.os }}-${{ hashFiles('systemscope/tests/act4/build-act4.sh') }}
      # `mise install ruby` asks the GitHub API for Ruby releases on every run, cache or
      # not; unauthenticated, the runner's shared 60 requests/hour can run out. mise reads
      # MISE_GITHUB_TOKEN first, and no other tool in the build does.
      - name: Generate the corpus (A)
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: bash tests/act4/build-act4.sh ~/act4-cache target/act4/gen-a
      - name: Generate the corpus again from scratch (B)
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: bash tests/act4/build-act4.sh ~/act4-cache target/act4/gen-b
      - name: Generations A and B are byte-identical
        run: |
          diff -r target/act4/gen-a target/act4/gen-b
          test -z "$(find target/act4/gen-a/elfs -type f ! -perm 0644)"
      - name: The generations reproduce the committed ELFs and manifest
        run: |
          cargo xtask act4 check target/act4/gen-a
          cargo xtask act4 check target/act4/gen-b
      - name: M1-A4 ACT4 RV32I on m1-reference
        run: cargo xtask act4 run
      - name: Committed files unchanged
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - name: Keep the generation
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: act4-generation
          path: |
            systemscope/target/act4
            /tmp/systemscope-act4/make.log
          if-no-files-found: ignore
