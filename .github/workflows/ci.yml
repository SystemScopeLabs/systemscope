name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: systemscope

jobs:
  lint:
    name: fmt, check, clippy, machete
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: systemscope
      # systemscope depends on `../contracts` by path (plan.md §10), so reproduce the
      # sibling layout, with contracts pinned to a pushed revision (bump it deliberately).
      - uses: actions/checkout@v4
        with:
          repository: SystemScopeLabs/contracts
          ref: 4d6e912a7ccffb676d0f95ff523c553fe3048c47
          path: contracts
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: systemscope
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo machete

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: systemscope
      # systemscope depends on `../contracts` by path (plan.md §10), so reproduce the
      # sibling layout, with contracts pinned to a pushed revision (bump it deliberately).
      - uses: actions/checkout@v4
        with:
          repository: SystemScopeLabs/contracts
          ref: 4d6e912a7ccffb676d0f95ff523c553fe3048c47
          path: contracts
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: systemscope
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Unit and integration tests
        run: cargo nextest run --workspace --exclude systemscope-acceptance --locked --profile ci --no-fail-fast
      # nextest does not run doctests.
      - name: Doctests
        run: cargo test --workspace --doc --locked
      # docs/m0-design.md §9 on the full m0-reference. The golden digests and the portable
      # snapshot are checked on both operating systems.
      - name: Acceptance harness self-tests
        run: cargo nextest run -p systemscope-acceptance --locked --profile ci --no-fail-fast --lib --bins
      - name: AT-1 reproducibility (fixed seeds, golden digests)
        run: cargo nextest run -p systemscope-acceptance --locked --profile ci --no-fail-fast --test at1
      - name: AT-2 snapshot/restore equivalence (checkpoints, portable snapshot)
        run: cargo nextest run -p systemscope-acceptance --locked --profile ci --no-fail-fast --test at2
      - name: AT-3 observation invariance (O0-O5, compile-fail)
        run: cargo nextest run -p systemscope-acceptance --locked --profile ci --no-fail-fast --test at3 --test compile_fail
      # Only `cargo xtask bless` writes golden files; a test that wrote one would show here.
      - name: Golden files unchanged
        shell: bash
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
